services:
  moderation:
    build:
      context: ./moderation-service
      dockerfile: Dockerfile
    expose:
      - "8080"
    restart: unless-stopped
    mem_limit: 768m
    cpus: "0.6"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - backend

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    expose:
      - "8000"
    depends_on:
      moderation:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 384m
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      MODERATION_URL: http://moderation:8080
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8000/healthz').then((res) => process.exit(res.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - frontend
      - backend

  caddy:
    image: caddy:2-alpine
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    networks:
      - frontend

networks:
  frontend:
  backend:
    internal: true

volumes:
  caddy_data:
  caddy_config:
