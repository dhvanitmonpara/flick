services:
  moderation:
    build:
      context: ./moderation-service
      dockerfile: Dockerfile
    restart: unless-stopped
    mem_limit: 768m
    cpus: "0.6"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - backend

  api:
    container_name: flick-api
    build:
      context: .
      dockerfile: server/Dockerfile
    expose:
      - "8000"
    depends_on:
      moderation:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 384m
    env_file:
      - .env.production
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8000/healthz').then((res) => process.exit(res.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - caddy_net
      - backend

networks:
  caddy_net:
    external: true

  backend:
    internal: true